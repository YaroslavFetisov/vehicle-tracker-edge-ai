[project]
name = "vehicle-tracker-edge-ai"
version = "0.1.0"
description = "Real-time vehicle traffic analysis: tracking, license plate recognition and colour detection"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "PTH", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires model weights and sample footage, skipped when they are absent",
]
