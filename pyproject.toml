[project]
name = "vehicle-tracker-edge-ai"
version = "0.1.0"
description = "Real-time vehicle traffic analysis: tracking, license plate recognition and colour detection"
requires-python = ">=3.11"
license = "AGPL-3.0-only"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "PTH", "C4"]

[tool.ruff.lint.per-file-ignores]
# the scripts are run as files, so they put the project root on sys.path before importing it
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# a bare pytest, as CI runs it, does not put the project root on sys.path the way
# python -m pytest does
pythonpath = ["."]
markers = [
    "integration: requires model weights and sample footage, skipped when they are absent",
]
