name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # unit tests cover the pure modules and need no ML stack; the runner has no display
      - run: pip install -r requirements-dev.txt numpy==2.5.2 opencv-python-headless==5.0.0.93
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not integration"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t vehicle-tracker .
      # proves the image starts and that cv2 imports with no display present
      - run: docker run --rm vehicle-tracker --help
